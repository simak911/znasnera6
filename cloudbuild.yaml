steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/znasnera6', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/znasnera6']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'znasnera6',
        '--image', 'gcr.io/$PROJECT_ID/znasnera6',
        '--platform', 'managed',
        '--region', 'europe-central2',
        '--set-env-vars', 'ENV=prod',
        '--allow-unauthenticated'
      ]

images:
  - 'gcr.io/$PROJECT_ID/znasnera6'

options:
  logging: CLOUD_LOGGING_ONLY